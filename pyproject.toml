[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["backend"]
addopts = "--strict-config --strict-markers"
markers = [
    "integration: requires a real, isolated PostgreSQL+pgvector database (TEST_DATABASE_URL); not collected by default testpaths",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = [
    "backend/core/config.py", "backend/core/database.py", "backend/main.py",
    "backend/models/platform.py", "backend/models/platform_schemas.py",
    "backend/api/dependencies.py", "backend/api/browser_session.py", "backend/api/platform_errors.py",
    "backend/api/endpoints/auth.py", "backend/api/endpoints/applications.py", "backend/api/endpoints/teams.py",
    "backend/services/auth_service.py", "backend/services/application_service.py",
    "backend/services/policy_service.py", "backend/services/audit_service.py", "backend/services/pagination.py",
    "backend/models/operations.py", "backend/models/operation_schemas.py",
    "backend/services/operation_service.py", "backend/services/queue_service.py",
    "backend/api/endpoints/operations.py", "backend/worker.py", "backend/queue_probe.py",
    "backend/bootstrap.py", "backend/seed_sandbox.py",
    "backend/models/environment_schemas.py", "backend/services/environment_service.py",
    "backend/api/endpoints/environments.py",
]
mypy_path = ["backend"]
explicit_package_bases = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true
