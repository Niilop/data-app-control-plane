[project]
name = "@@package_name@@"
version = "0.1.0"
description = "Synthetic batch data application for @@application_slug@@"
requires-python = ">=3.11"

# Deliberately empty: the batch entry point uses only the Python standard
# library, so `uv sync --locked` and the test suite run with no network access.
# Add dependencies here and re-lock before introducing any third-party import.
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
