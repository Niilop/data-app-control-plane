# Pull-request checks for @@application_slug@@. No workspace credentials are used
# or required here, including on forks. `pull_request` (not `pull_request_target`)
# keeps untrusted contributions away from repository secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-checks:
    name: Locked install, lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff@0.16.7 check .
      - run: uvx ruff@0.16.7 format --check .
      - run: uv run python -m unittest discover --start-directory tests --top-level-directory .
