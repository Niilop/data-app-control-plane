name: Python batch CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: batch-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ROOT: '__BUNDLE_ROOT__'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.11'
          python-version: '3.11'
          enable-cache: false
      - name: Install locked CI tools
        run: uv sync --locked --project .control-plane-ci
      - name: Lint, type check, test, inspect and build
        run: uv run --locked --project .control-plane-ci python .control-plane-ci/check.py
