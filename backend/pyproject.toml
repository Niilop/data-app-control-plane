[project]
name = "backend"
version = "0.1.0"
description = "FastAPI data application control plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pydantic[email]",
    "pydantic-settings",
    "python-dotenv",
    "pgvector",
    "slowapi",
    "sqlalchemy==2.0.23",
    "psycopg2-binary",
    "alembic==1.13.0",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<4.0",
    "python-multipart",
    "pandas",
    "werkzeug",
]

[tool.uv]
package = false
